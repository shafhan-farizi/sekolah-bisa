name: CI/CD Build Cloud and Deploy Local

on:
  push:
    branches: [ main ]

jobs:
  # Tahap 1: Build berat di server Cloud GitHub (Hemat resource Advan)
  build-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React Assets
        run: |
          npm ci
          npm run build

      - name: Archive Production Package
        run: |
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.env' \
              --exclude='database/database.sqlite' \
              --exclude='tests' \
              --exclude='deploy-package.tar.gz' \
              -czf /tmp/deploy-package.tar.gz .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-build
          path: /tmp/deploy-package.tar.gz
          retention-days: 1

  # Tahap 2: Advan download & ekstrak file jadi
  deploy-advan:
    needs: build-cloud
    runs-on: self-hosted
    steps:
      - name: Download Artifact from Cloud
        uses: actions/download-artifact@v4
        with:
          name: laravel-build
          path: /tmp

      - name: Extract & Update Laravel on Advan
        run: |
          # 1. Ekstrak package
          sudo tar --overwrite --no-same-owner -xzf /tmp/deploy-package.tar.gz -C /var/www/sekolah-bisa/
          rm -f /tmp/deploy-package.tar.gz
          
          cd /var/www/sekolah-bisa

          # 2. Perbaiki permission TERLEBIH DAHULU sebelum artisan dijalankan
          sudo chown -R www-data:www-data storage bootstrap/cache database
          sudo chmod -R 775 storage bootstrap/cache database
          # Khusus SQLite: pastikan file database memiliki izin baca & tulis
          if [ -f database/database.sqlite ]; then
            sudo chmod 664 database/database.sqlite
          fi

          # 3. Jalankan artisan command sebagai user www-data
          sudo -u www-data php artisan migrate --force
          sudo -u www-data php artisan optimize:clear
          sudo -u www-data php artisan optimize